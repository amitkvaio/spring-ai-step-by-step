spring.application.name=01-first-ai-chat
server.port=${PORT:8081}
# Bind learning endpoints locally. Add authentication before exposing a model service.
server.address=127.0.0.1
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:llama3.2:3b}
# Pull explicitly before class; application startup must not download large models.
spring.ai.ollama.init.pull-model-strategy=never
# Keep beginner failures visible; bounded retry policies are taught later.
# In 2.0.2 this value is passed to maxRetries: zero means no retries.
spring.ai.retry.max-attempts=0
