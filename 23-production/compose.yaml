services:
  app:
    build: .
    ports:
      - "127.0.0.1:8103:8103"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      SERVER_ADDRESS: 0.0.0.0
    depends_on:
      - ollama
    mem_limit: 768m
    cpus: 2
    stop_grace_period: 15s
  ollama:
    image: ollama/ollama:latest
    volumes:
      - models:/root/.ollama
volumes:
  models:
