services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: course
      POSTGRES_USER: ${DB_USER:-course}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-course}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - vectors:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d course"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  vectors:
