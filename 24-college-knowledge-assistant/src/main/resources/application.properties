spring.application.name=24-college-knowledge-assistant
server.address=127.0.0.1
server.port=${PORT:8104}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:llama3.2:3b}
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
spring.ai.ollama.init.pull-model-strategy=never
# Pinned 2.0.2 maps this property to retry count, not total attempts.
spring.ai.retry.max-attempts=0
course.jdbc-url=${JDBC_URL:jdbc:postgresql://localhost:5433/course}
course.db-user=${DB_USER:course}
course.db-password=${DB_PASSWORD:local-course}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=30s
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,ollama
