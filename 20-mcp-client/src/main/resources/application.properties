spring.application.name=20-mcp-client
server.address=127.0.0.1
server.port=${PORT:8100}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:llama3.2:3b}
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
spring.ai.ollama.init.pull-model-strategy=never
# Pinned 2.0.2 maps this property to retry count, not total attempts.
spring.ai.retry.max-attempts=0
spring.ai.mcp.client.name=college-client
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=5s
spring.ai.mcp.client.streamable-http.connections.shop.url=${MCP_SERVER_URL:http://localhost:8099}
